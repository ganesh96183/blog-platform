<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postbox – Blog Platform with Comments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171325; --side:#100d1c; --card:#221c36; --card2:#2b2445; --line:#3a3157;
    --text:#ece8f7; --muted:#a59fc0; --accent:#ffb454; --accent-ink:#2a1a00;
    --me:#3b2f66; --danger:#ff7a8a;
    --head:"Space Grotesk", system-ui, sans-serif;
    --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.55;min-height:100vh}
  a{color:var(--accent)}
  button,input,textarea{font:inherit}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  aside{background:var(--side);border-right:1px solid var(--line);padding:26px 20px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
  .brand{font-family:var(--head);font-size:1.6rem;font-weight:700;color:var(--text);text-decoration:none;letter-spacing:-.02em}
  .brand span{color:var(--accent)}
  .side-nav{display:flex;flex-direction:column;gap:8px}
  .side-nav .who{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px 12px;border-radius:12px;font-weight:600;overflow:hidden}
  .side-nav .who small{display:block;color:var(--muted);font-weight:400}

  main{padding:34px clamp(18px,4vw,48px) 70px;max-width:1000px;width:100%}
  h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15;letter-spacing:-.01em}
  h1{font-size:2.3rem}
  .lead{color:var(--muted);margin:8px 0 26px}

  .btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 16px;border-radius:999px;cursor:pointer;text-decoration:none;font-weight:600}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
  .btn.danger{color:var(--danger);border-color:#5d3342}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger)}
  .btn.small{padding:4px 12px;font-size:.85rem}

  .avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--head);font-weight:700}
  .avatar.sm{width:30px;height:30px;font-size:.85rem}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
  .tile:hover{border-color:var(--accent)}
  .tile h2{font-size:1.35rem}
  .tile h2 a{color:var(--text);text-decoration:none}
  .tile p{margin:0;color:var(--muted);flex:1}
  .tile .foot{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted)}
  .pill{margin-left:auto;background:var(--card2);padding:2px 10px;border-radius:999px}

  article.post{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,38px)}
  .byline{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.92rem;margin:14px 0 22px}
  .byline strong{color:var(--text);display:block}
  .body{font-size:1.1rem;line-height:1.8;max-width:66ch;white-space:pre-wrap}
  .actions{display:flex;gap:10px;margin-top:26px}

  .comments{margin-top:34px}
  .comments h2{font-size:1.5rem;margin-bottom:16px}
  .bubble-row{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
  .bubble{background:var(--card2);border-radius:4px 18px 18px 18px;padding:10px 16px;max-width:620px;min-width:200px}
  .bubble.mine{background:var(--me)}
  .bubble header{display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:.88rem;color:var(--muted)}
  .bubble header strong{color:var(--text)}
  .bubble p{margin:4px 0 0;white-space:pre-wrap}

  form.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;max-width:480px}
  form.panel.wide{max-width:none}
  label{display:block;font-weight:600;margin:16px 0 6px}
  input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--side);color:var(--text)}
  textarea{min-height:100px;resize:vertical}
  textarea.big{min-height:300px;line-height:1.7}
  .err{color:var(--danger);margin:12px 0 0;min-height:1.2em}
  .empty{border:1px dashed var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .hint{margin:14px 0 0;color:var(--muted);font-size:.92rem}

  @media (max-width:800px){
    .layout{grid-template-columns:1fr}
    aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 18px}
    .side-nav{flex-direction:row;flex-wrap:wrap;align-items:center;margin-left:auto}
    h1{font-size:1.9rem}
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <a class="brand" href="#/">Post<span>box</span></a>
    <nav class="side-nav" id="nav" aria-label="Main"></nav>
  </aside>
  <main id="app"></main>
</div>

<script>
/* ---------- Tiny "database" (browser localStorage) ----------
   Replace DB.* with fetch() calls to a REST API when you add a backend. */
const DB = {
  load(k, d){ try{ return JSON.parse(localStorage.getItem('pb_'+k)) ?? d }catch(e){ return d } },
  save(k, v){ try{ localStorage.setItem('pb_'+k, JSON.stringify(v)) }catch(e){} },
  get users(){ return this.load('users', []) },
  get posts(){ return this.load('posts', []) },
  get comments(){ return this.load('comments', []) },
  get session(){ return this.load('session', null) }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => new Date(t).toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
function hash(str){ let h = 5381; for (const c of str) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return String(h); } // demo only

const me = () => DB.users.find(u => u.id === DB.session);
const userName = id => (DB.users.find(u => u.id === id) || {name:'Deleted user'}).name;
const initial = id => esc(userName(id).trim().charAt(0).toUpperCase() || '?');

if (!DB.posts.length) {
  DB.save('users', [{id:'demo', name:'Postbox Team', email:'team@example.com', pass:hash('demo-not-for-login')}]);
  DB.save('posts', [{
    id: uid(), authorId:'demo', createdAt: Date.now(),
    title: 'Welcome to Postbox',
    body: 'Create an account, publish your first post, and reply to others in the comments.\n\nAuthors can edit or delete their own posts. You can delete your own comments too.'
  }]);
}

/* ---------- Auth ---------- */
function register(name, email, pass){
  const users = DB.users;
  if (name.trim().length < 2) return 'Enter a name with at least 2 characters.';
  if (!/^\S+@\S+\.\S+$/.test(email)) return 'Enter a valid email address.';
  if (pass.length < 6) return 'Use a password with at least 6 characters.';
  if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) return 'That email is already registered. Log in instead.';
  const user = {id: uid(), name: name.trim(), email: email.trim(), pass: hash(pass)};
  DB.save('users', [...users, user]);
  DB.save('session', user.id);
  return null;
}
function login(email, pass){
  const u = DB.users.find(u => u.email.toLowerCase() === email.trim().toLowerCase() && u.pass === hash(pass));
  if (!u) return 'Email or password is incorrect.';
  DB.save('session', u.id);
  return null;
}
function logout(){ DB.save('session', null); location.hash = '#/'; render(); }

/* ---------- Views ---------- */
const app = document.getElementById('app');

function renderNav(){
  const u = me();
  document.getElementById('nav').innerHTML = u
    ? `<div class="who"><span class="avatar sm">${initial(u.id)}</span><div>${esc(u.name)}<small>Signed in</small></div></div>
       <a class="btn primary" href="#/new">New post</a>
       <button class="btn" id="logoutBtn">Log out</button>`
    : `<a class="btn primary" href="#/register">Create account</a><a class="btn" href="#/login">Log in</a>`;
  const b = document.getElementById('logoutBtn'); if (b) b.onclick = logout;
}

function homeView(){
  const posts = [...DB.posts].sort((a, b) => b.createdAt - a.createdAt);
  const counts = {}; DB.comments.forEach(c => counts[c.postId] = (counts[c.postId] || 0) + 1);
  app.innerHTML = `<h1>All posts</h1><p class="lead">Read, write and reply.</p>` +
    (posts.length ? `<div class="grid">` + posts.map(p => `
      <div class="tile">
        <h2><a href="#/post/${p.id}">${esc(p.title)}</a></h2>
        <p>${esc(p.body.length > 140 ? p.body.slice(0, 140).trim() + '…' : p.body)}</p>
        <div class="foot"><span class="avatar sm">${initial(p.authorId)}</span>${esc(userName(p.authorId))} · ${fmt(p.createdAt)}
          <span class="pill">${counts[p.id] || 0} 💬</span></div>
      </div>`).join('') + `</div>`
    : `<div class="empty">No posts yet. Write the first one.</div>`);
}

function postView(id){
  const p = DB.posts.find(x => x.id === id);
  if (!p) { app.innerHTML = `<div class="empty">This post doesn't exist or was deleted. <a href="#/">Back to all posts</a></div>`; return; }
  const u = me(), mine = u && u.id === p.authorId;
  const comments = DB.comments.filter(c => c.postId === id).sort((a, b) => a.createdAt - b.createdAt);

  app.innerHTML = `
    <article class="post">
      <h1>${esc(p.title)}</h1>
      <div class="byline"><span class="avatar">${initial(p.authorId)}</span>
        <div><strong>${esc(userName(p.authorId))}</strong>${fmt(p.createdAt)}${p.updatedAt ? ' · edited' : ''}</div></div>
      <div class="body">${esc(p.body)}</div>
      ${mine ? `<div class="actions"><a class="btn" href="#/edit/${p.id}">Edit post</a><button class="btn danger" id="delPost">Delete post</button></div>` : ''}
    </article>

    <section class="comments" aria-labelledby="ch">
      <h2 id="ch">Comments (${comments.length})</h2>
      <div>${comments.length ? comments.map(c => {
        const own = u && u.id === c.authorId;
        return `<div class="bubble-row"><span class="avatar sm">${initial(c.authorId)}</span>
          <div class="bubble ${own ? 'mine' : ''}">
            <header><span><strong>${esc(userName(c.authorId))}</strong> · ${fmt(c.createdAt)}</span>
              ${own ? `<button class="btn small danger" data-del="${c.id}">Delete</button>` : ''}</header>
            <p>${esc(c.text)}</p></div></div>`;
      }).join('') : `<div class="empty">No comments yet. Say something first.</div>`}</div>
      ${u ? `<form id="cform" class="panel wide" style="margin-top:18px">
              <label for="ctext" style="margin-top:0">Add a comment</label>
              <textarea id="ctext" required maxlength="1000"></textarea>
              <p class="err" id="cerr" role="alert"></p>
              <button class="btn primary" type="submit">Post comment</button>
            </form>`
          : `<p class="hint"><a href="#/login">Log in</a> or <a href="#/register">create an account</a> to comment.</p>`}
    </section>`;

  const del = document.getElementById('delPost');
  if (del) del.onclick = () => {
    if (!confirm('Delete this post and all its comments?')) return;
    DB.save('posts', DB.posts.filter(x => x.id !== id));
    DB.save('comments', DB.comments.filter(c => c.postId !== id));
    location.hash = '#/';
  };
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    DB.save('comments', DB.comments.filter(c => c.id !== b.dataset.del));
    postView(id);
  });
  const cf = document.getElementById('cform');
  if (cf) cf.onsubmit = e => {
    e.preventDefault();
    const text = document.getElementById('ctext').value.trim();
    if (!text) { document.getElementById('cerr').textContent = 'Write something before posting.'; return; }
    DB.save('comments', [...DB.comments, {id: uid(), postId: id, authorId: u.id, text, createdAt: Date.now()}]);
    postView(id);
  };
}

function editorView(id){
  const u = me();
  if (!u) { location.hash = '#/login'; return; }
  const existing = id ? DB.posts.find(x => x.id === id) : null;
  if (id && (!existing || existing.authorId !== u.id)) {
    app.innerHTML = `<div class="empty">You can only edit your own posts. <a href="#/">Back to all posts</a></div>`; return;
  }
  app.innerHTML = `
    <h1>${existing ? 'Edit post' : 'New post'}</h1>
    <form id="pform" class="panel wide" style="margin-top:20px">
      <label for="ptitle" style="margin-top:0">Title</label>
      <input id="ptitle" type="text" maxlength="120" required value="${existing ? esc(existing.title) : ''}">
      <label for="pbody">Story</label>
      <textarea id="pbody" class="big" required>${existing ? esc(existing.body) : ''}</textarea>
      <p class="err" id="perr" role="alert"></p>
      <div class="row"><button class="btn primary" type="submit">${existing ? 'Save changes' : 'Publish post'}</button>
      <a class="btn" href="${existing ? '#/post/' + existing.id : '#/'}">Cancel</a></div>
    </form>`;
  document.getElementById('pform').onsubmit = e => {
    e.preventDefault();
    const title = document.getElementById('ptitle').value.trim();
    const body = document.getElementById('pbody').value.trim();
    if (!title || !body) { document.getElementById('perr').textContent = 'Add both a title and a story.'; return; }
    if (existing) {
      DB.save('posts', DB.posts.map(x => x.id === id ? {...x, title, body, updatedAt: Date.now()} : x));
      location.hash = '#/post/' + id;
    } else {
      const np = {id: uid(), authorId: u.id, title, body, createdAt: Date.now()};
      DB.save('posts', [...DB.posts, np]);
      location.hash = '#/post/' + np.id;
    }
  };
}

function authView(mode){
  const isReg = mode === 'register';
  app.innerHTML = `
    <h1>${isReg ? 'Create your account' : 'Welcome back'}</h1>
    <form id="aform" class="panel" style="margin-top:20px">
      ${isReg ? `<label for="aname" style="margin-top:0">Name</label><input id="aname" type="text" autocomplete="name" required>` : ''}
      <label for="aemail" ${isReg ? '' : 'style="margin-top:0"'}>Email</label><input id="aemail" type="email" autocomplete="email" required>
      <label for="apass">Password</label><input id="apass" type="password" autocomplete="${isReg ? 'new-password' : 'current-password'}" required>
      <p class="err" id="aerr" role="alert"></p>
      <button class="btn primary" type="submit">${isReg ? 'Create account' : 'Log in'}</button>
      <p class="hint">${isReg ? 'Already registered? <a href="#/login">Log in</a>' : 'New here? <a href="#/register">Create an account</a>'}</p>
    </form>`;
  document.getElementById('aform').onsubmit = e => {
    e.preventDefault();
    const email = document.getElementById('aemail').value, pass = document.getElementById('apass').value;
    const err = isReg ? register(document.getElementById('aname').value, email, pass) : login(email, pass);
    if (err) { document.getElementById('aerr').textContent = err; return; }
    location.hash = '#/';
  };
}

/* ---------- Router ---------- */
function render(){
  renderNav();
  const [, route, id] = (location.hash || '#/').split('/');
  if (route === 'post') postView(id);
  else if (route === 'new') editorView();
  else if (route === 'edit') editorView(id);
  else if (route === 'login') authView('login');
  else if (route === 'register') authView('register');
  else homeView();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
